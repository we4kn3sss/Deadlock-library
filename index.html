    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;

        tg.ready();  // Сообщаем телеграму, что приложение готово

        // Отображение имени пользователя, если открыто в ТГ
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {

        }

        const heroesData = [

                                    <div class="text-xs text-textMuted">Pick: ${h.pickrate}</div>

        function renderHeroes(filterText = '') {
            const container = document.getElementById('heroes-grid');
            const filtered = heroesData.filter(h => h.name.toLowerCase().includes(filterText.toLowerCase()));
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-textMuted py-8">Герои не найдены</div>`;

            container.innerHTML = filtered.map(h => `

                            </div>

                    </div>
                </div>

        function renderPatches() {
            const container = document.getElementById('patches-list');
            container.innerHTML = patchesData.map(patch => `
                <div class="bg-surface art-deco-border rounded p-4 relative overflow-hidden">

                                <span>${note}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

        }

        // ==========================================
        // НАВИГАЦИЯ И СОБЫТИЯ
        // ==========================================

        function switchTab(tabId) {
            // Скрываем все секции
            ['meta', 'heroes', 'items', 'patches'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
            });
            // Показываем нужную
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            // Обновляем стили кнопок навигации
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.target === tabId) {
                    btn.classList.remove('text-textMuted');
                    btn.classList.add('text-gold');
                } else {
                    btn.classList.add('text-textMuted');
                    btn.classList.remove('text-gold');
                }
            });

            // Прокручиваем наверх при смене вкладки
            document.getElementById('main-content').scrollTo(0,0);
            
            // Если включен виброотклик в ТГ
            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        // Поиск по героям
        document.getElementById('hero-search').addEventListener('input', (e) => {
            renderHeroes(e.target.value);
        });

        // ==========================================
        // СТАРТ ПРИЛОЖЕНИЯ
        // ==========================================
        
        // Рендерим все данные
        renderMeta();
        renderHeroes();
        renderItems();
        renderPatches();

        // По умолчанию открываем вкладку "Мета"
        document.getElementById('tab-meta').classList.remove('hidden');

    </script>
