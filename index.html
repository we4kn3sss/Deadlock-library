<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deadlock Library</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cormorant Garamond & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        noirBg: '#0a0a09',       
                        noirCard: '#161513',     
                        parchment: '#e6dcc6',    
                        parchmentMuted: '#8c8577',
                        accentDark: '#3a352d'    
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0a09;
            color: #e6dcc6;
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            /* Шум для эффекта старой бумаги */
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.03"/%3E%3C/svg%3E');
        }

        ::-webkit-scrollbar { width: 0px; display: none; }

        .occult-title { font-family: '"Cormorant Garamond"', serif; }

        .vintage-border {
            border: 1px solid #3a352d;
            transition: border-color 0.3s ease;
        }

        /* Выпадающий список стилизация */
        select.vintage-select {
            appearance: none;
            background-color: #161513;
            border: 1px solid #3a352d;
            color: #e6dcc6;
            padding: 8px;
            font-family: '"Cormorant Garamond"', serif;
            font-size: 14px;
            width: 100%;
            outline: none;
            text-align: center;
        }

        /* Навигация (Анимации выезда) */
        .nav-wrapper {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 40;
            pointer-events: none;
        }

        .main-nav-btn {
            position: relative;
            z-index: 50;
            width: 64px;
            height: 64px;
            background-color: #161513;
            /* Здесь указана твоя картинка */
            background-image: url('./58401.jpg');
            background-size: cover;
            background-position: center;
            border: 1px solid #3a352d;
            border-radius: 50%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
            pointer-events: auto;
            outline: none;
        }
        
        /* Запасной вариант, если картинки еще нет */
        .main-nav-btn::after {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(230, 220, 198, 0.2);
            border-radius: 50%;
        }

        .main-nav-btn.active {
            transform: rotate(360deg);
            border-color: #e6dcc6;
        }

        .nav-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            background: #161513;
            border: 1px solid #3a352d;
            border-radius: 50%;
            color: #8c8577;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            z-index: 45;
        }

        .nav-item.selected {
            color: #e6dcc6;
            border-color: #e6dcc6;
        }

        .nav-expanded .nav-item[data-target="meta"] { transform: translate(calc(-50% - 120px), -50%) scale(1); opacity: 1; }
        .nav-expanded .nav-item[data-target="heroes"] { transform: translate(calc(-50% - 60px), -50%) scale(1); opacity: 1; }
        .nav-expanded .nav-item[data-target="items"] { transform: translate(calc(-50% + 60px), -50%) scale(1); opacity: 1; }
        .nav-expanded .nav-item[data-target="patches"] { transform: translate(calc(-50% + 120px), -50%) scale(1); opacity: 1; }

        /* Вкладки */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        
        /* Досье Героя */
        #hero-detail-view {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a09;
            z-index: 30;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 100px; /* Отступ для меню */
        }
        #hero-detail-view.active {
            display: block;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Модальные окна */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(10, 10, 9, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-box {
            background: #161513;
            border: 1px solid #e6dcc6;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Спецэффект для выбранной способности */
        .ability-btn { transition: all 0.2s; }
        .ability-btn.active { border-color: #e6dcc6; background: rgba(230, 220, 198, 0.1); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Хедер -->
    <header class="pt-6 pb-4 px-4 text-center z-10 shrink-0 border-b border-accentDark">
        <h1 class="text-parchment occult-title text-2xl font-semibold tracking-wide">Archive Records</h1>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto pb-32 px-4 pt-6" id="main-content">
        
        <!-- Вкладка: META (Заглушка) -->
        <section id="tab-meta" class="tab-content active text-center text-parchmentMuted font-serif italic mt-10">
            [Meta Data currently unavailable...]
        </section>

        <!-- Вкладка: HEROES (Сетка) -->
        <section id="tab-heroes" class="tab-content">
            <h2 class="text-xl occult-title text-parchment mb-4 border-b border-accentDark pb-2">Persons of Interest</h2>
            <div id="heroes-grid" class="grid grid-cols-3 gap-3">
                <!-- Сетка генерируется в JS -->
            </div>
        </section>

        <!-- Вкладка: ITEMS (Заглушка) -->
        <section id="tab-items" class="tab-content text-center text-parchmentMuted font-serif italic mt-10">
            [Armory Archives sealed...]
        </section>

        <!-- Вкладка: PATCHES (Заглушка) -->
        <section id="tab-patches" class="tab-content text-center text-parchmentMuted font-serif italic mt-10">
            [Awaiting new manifests...]
        </section>
    </main>

    <!-- ДОСЬЕ ГЕРОЯ (Hero Detail View) -->
    <div id="hero-detail-view">
        <!-- Шапка досье -->
        <div class="flex items-center gap-4 mb-6">
            <button onclick="closeHeroDetail()" class="text-parchmentMuted hover:text-parchment text-xl">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 id="hd-name" class="text-3xl occult-title text-parchment font-semibold tracking-wider uppercase"></h2>
        </div>

        <!-- Центральный блок: Статы | Фото | Кнопки П/Л -->
        <div class="flex justify-between items-stretch gap-3 mb-6">
            
            <!-- Левая колонка: Статы -->
            <div class="w-1/3 flex flex-col justify-between">
                <div class="vintage-border bg-noirCard">
                    <select id="hd-rank-select" class="vintage-select" onchange="updateStats()">
                        <option value="low">Лоу ранги</option>
                        <option value="mid" selected>Средние</option>
                        <option value="high">Этернус</option>
                    </select>
                </div>
                <div class="vintage-border bg-noirCard mt-2 p-2 flex flex-col gap-2 flex-grow justify-center text-center">
                    <div>
                        <div class="text-[10px] text-parchmentMuted uppercase font-sans tracking-widest">ПР</div>
                        <div id="hd-pr" class="text-lg text-parchment font-serif font-bold">--%</div>
                    </div>
                    <div class="w-8 border-t border-accentDark mx-auto"></div>
                    <div>
                        <div class="text-[10px] text-parchmentMuted uppercase font-sans tracking-widest">ВР</div>
                        <div id="hd-vr" class="text-lg text-parchment font-serif font-bold">--%</div>
                    </div>
                </div>
            </div>

            <!-- Центральная колонка: Фото персонажа (пока заглушка) -->
            <div class="flex-1 vintage-border bg-noirCard flex items-center justify-center relative min-h-[200px]">
                <i class="fa-solid fa-user text-4xl text-accentDark"></i>
                <div class="absolute inset-0 border border-parchment/5 m-1"></div>
            </div>

            <!-- Правая колонка: Кнопки П и Л -->
            <div class="w-1/6 flex flex-col gap-3 justify-center">
                <button onclick="openModal('items')" class="vintage-border bg-noirCard aspect-square flex items-center justify-center text-parchment font-serif text-xl hover:border-parchment transition-colors">
                    П
                </button>
                <button onclick="openModal('lore')" class="vintage-border bg-noirCard aspect-square flex items-center justify-center text-parchment font-serif text-xl hover:border-parchment transition-colors">
                    Л
                </button>
            </div>
        </div>

        <!-- Нижний блок: Способности -->
        <div class="mt-4">
            <h3 class="text-sm occult-title text-parchmentMuted mb-2 tracking-widest uppercase">Abilities</h3>
            <!-- 4 квадратика -->
            <div id="hd-abilities-row" class="grid grid-cols-4 gap-2 mb-4">
                <!-- Генерируется JS -->
            </div>

            <!-- Детальная информация по выбранной способности -->
            <div id="hd-ability-detail" class="vintage-border bg-noirCard p-3 flex gap-4 hidden">
                <!-- Слева квадрат способности -->
                <div id="hd-ab-icon" class="w-14 h-14 shrink-0 vintage-border bg-noirBg flex items-center justify-center text-xl text-parchment">
                </div>
                <!-- Справа текст -->
                <div class="flex-1">
                    <h4 id="hd-ab-name" class="font-serif text-parchment text-lg leading-none mb-1"></h4>
                    <p id="hd-ab-desc" class="text-xs text-parchmentMuted font-sans mb-2"></p>
                    <div id="hd-ab-upgrades" class="text-[10px] font-sans text-parchment space-y-1">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальные окна (Предметы и Лор) -->
    <div id="custom-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4 border-b border-accentDark pb-2">
                <h3 id="modal-title" class="text-xl occult-title text-parchment"></h3>
                <button onclick="closeModal(true)" class="text-parchmentMuted hover:text-parchment"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-content" class="text-sm text-parchmentMuted font-sans leading-relaxed">
                <!-- Контент -->
            </div>
        </div>
    </div>

    <!-- Навигация снизу -->
    <div class="nav-wrapper" id="nav-container">
        <button class="nav-item" data-target="meta" onclick="selectTab('meta')"><i class="fa-solid fa-chart-line"></i></button>
        <button class="nav-item selected" data-target="heroes" onclick="selectTab('heroes')"><i class="fa-solid fa-users"></i></button>
        <button class="nav-item" data-target="items" onclick="selectTab('items')"><i class="fa-solid fa-box"></i></button>
        <button class="nav-item" data-target="patches" onclick="selectTab('patches')"><i class="fa-solid fa-scroll"></i></button>

        <!-- Центральная кнопка (Лого) -->
        <button class="main-nav-btn" id="center-logo" onclick="toggleNav()"></button>
    </div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#0a0a09');
        tg.setBackgroundColor('#0a0a09');

        // --- БАЗА ДАННЫХ (Mock Data) ---
        const db = {
            "abrams": {
                name: "Abrams",
                stats: {
                    low: { pr: "18.5%", vr: "48.2%" },
                    mid: { pr: "15.0%", vr: "51.1%" },
                    high: { pr: "12.3%", vr: "54.5%" }
                },
                lore: "A hardened detective with a demonic arm. He prefers to ask questions with his fists and read the answers in blood.",
                items: "Core: Colossus, Siphon Bullets.<br>Situational: Silence Glyph.",
                abilities: [
                    { name: "Siphon Life", desc: "Drains vitality from nearby enemies.", upgrades: ["+Radius", "+Damage", "-Cooldown"] },
                    { name: "Shoulder Charge", desc: "Charge forward, pinning an enemy to a wall.", upgrades: ["+Distance", "+Stun Duration", "+Damage"] },
                    { name: "Infernal Resilience", desc: "Passive health regeneration.", upgrades: ["+Regen", "+Armor", "Status Resist"] },
                    { name: "Seismic Smash", desc: "Leap into the air and slam the ground.", upgrades: ["+Radius", "+Damage", "Execute low HP"] }
                ]
            },
            "vindicta": {
                name: "Vindicta",
                stats: {
                    low: { pr: "22.1%", vr: "46.5%" },
                    mid: { pr: "18.4%", vr: "49.8%" },
                    high: { pr: "25.2%", vr: "52.0%" }
                },
                lore: "An undead sniper fueled by vengeance. She takes to the skies to deliver fatal judgments from afar.",
                items: "Core: High-Velocity Mag, Glass Cannon.<br>Situational: Headhunter.",
                abilities: [
                    { name: "Stake", desc: "Pins an enemy to their current location.", upgrades: ["+Duration", "+Damage", "Disarm"] },
                    { name: "Flight", desc: "Take to the skies for unmatched aerial advantage.", upgrades: ["+Duration", "+Move Speed", "+Weapon Damage"] },
                    { name: "Crow Familiar", desc: "Send a crow to deal damage and reveal.", upgrades: ["+Damage", "+Reveal Duration", "Apply Bleed"] },
                    { name: "Assassinate", desc: "Use a scoped rifle to execute enemies.", upgrades: ["+Zoom", "+Damage", "Refund on kill"] }
                ]
            },
            "seven": {
                name: "Seven",
                stats: {
                    low: { pr: "30.5%", vr: "54.1%" },
                    mid: { pr: "25.0%", vr: "52.3%" },
                    high: { pr: "15.1%", vr: "48.9%" }
                },
                lore: "A former prisoner of a lightning demon, Seven now commands the storm itself.",
                items: "Core: Spirit Power, Mystic Reach.<br>Situational: Refresher.",
                abilities: [
                    { name: "Lightning Ball", desc: "Fires a ball of lightning.", upgrades: ["+Radius", "+Speed", "+Damage"] },
                    { name: "Static Charge", desc: "Stuns enemies after a delay.", upgrades: ["+Radius", "-Delay", "+Stun Duration"] },
                    { name: "Power Surge", desc: "Attacks chain lightning to other targets.", upgrades: ["+Bounces", "+Damage", "Slow"] },
                    { name: "Storm Cloud", desc: "Massive AoE continuous damage.", upgrades: ["+Radius", "+Damage", "+Duration"] }
                ]
            }
        };

        // Текущее состояние
        let currentHeroId = null;

        // --- НАВИГАЦИЯ ---
        let isNavOpen = false;
        function toggleNav() {
            isNavOpen = !isNavOpen;
            const container = document.getElementById('nav-container');
            const logo = document.getElementById('center-logo');
            if (isNavOpen) {
                container.classList.add('nav-expanded');
                logo.classList.add('active');
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } else {
                container.classList.remove('nav-expanded');
                logo.classList.remove('active');
            }
        }

        function selectTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(btn => {
                if(btn.dataset.target === tabId) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
            
            // Если ушли с вкладки героев, закроем досье
            if(tabId !== 'heroes') closeHeroDetail();
            
            toggleNav();
        }

        // --- СЕТКА ГЕРОЕВ ---
        function renderHeroesGrid() {
            const grid = document.getElementById('heroes-grid');
            grid.innerHTML = Object.keys(db).map(key => `
                <div onclick="openHeroDetail('${key}')" class="bg-noirCard vintage-border aspect-square flex items-center justify-center cursor-pointer hover:border-parchment transition-colors p-2 text-center group">
                    <span class="font-serif text-parchment text-sm group-hover:scale-110 transition-transform">${db[key].name}</span>
                </div>
            `).join('');
        }

        // --- ДОСЬЕ ГЕРОЯ ---
        function openHeroDetail(heroId) {
            currentHeroId = heroId;
            const hero = db[heroId];
            
            // Заполняем данные
            document.getElementById('hd-name').innerText = hero.name;
            document.getElementById('hd-rank-select').value = 'mid'; // По умолчанию
            updateStats();

            // Рендер кнопок способностей
            const abRow = document.getElementById('hd-abilities-row');
            abRow.innerHTML = hero.abilities.map((ab, index) => `
                <button onclick="selectAbility(${index})" id="ab-btn-${index}" class="ability-btn vintage-border bg-noirCard aspect-square flex items-center justify-center text-parchment font-serif">
                    ${index + 1}
                </button>
            `).join('');

            // Скрываем детальную панель абилки
            document.getElementById('hd-ability-detail').classList.add('hidden');

            // Показываем вьюху
            document.getElementById('main-content').style.display = 'none';
            const detailView = document.getElementById('hero-detail-view');
            detailView.classList.add('active');
            window.scrollTo(0, 0);

            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function closeHeroDetail() {
            document.getElementById('hero-detail-view').classList.remove('active');
            document.getElementById('main-content').style.display = 'block';
            currentHeroId = null;
        }

        function updateStats() {
            if(!currentHeroId) return;
            const rank = document.getElementById('hd-rank-select').value;
            const stats = db[currentHeroId].stats[rank];
            document.getElementById('hd-pr').innerText = stats.pr;
            document.getElementById('hd-vr').innerText = stats.vr;
        }

        // --- СПОСОБНОСТИ ---
        function selectAbility(index) {
            if(!currentHeroId) return;
            const ab = db[currentHeroId].abilities[index];
            
            // Визуальное выделение кнопки
            document.querySelectorAll('.ability-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`ab-btn-${index}`).classList.add('active');

            // Заполнение нижней панели
            const panel = document.getElementById('hd-ability-detail');
            document.getElementById('hd-ab-icon').innerText = index + 1;
            document.getElementById('hd-ab-name').innerText = ab.name;
            document.getElementById('hd-ab-desc').innerText = ab.desc;
            
            document.getElementById('hd-ab-upgrades').innerHTML = ab.upgrades.map((upg, i) => `
                <div class="flex items-center gap-2">
                    <span class="text-accentDark border border-accentDark rounded-full w-3 h-3 flex items-center justify-center leading-none">+</span>
                    <span>${upg}</span>
                </div>
            `).join('');

            panel.classList.remove('hidden');
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        // --- МОДАЛЬНЫЕ ОКНА (П и Л) ---
        function openModal(type) {
            if(!currentHeroId) return;
            const hero = db[currentHeroId];
            
            document.getElementById('modal-title').innerText = type === 'items' ? 'Requisitioned Items' : 'Archive Lore';
            document.getElementById('modal-content').innerHTML = type === 'items' ? hero.items : hero.lore;
            
            document.getElementById('custom-modal').classList.add('active');
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function closeModal(force = false, event = null) {
            if (event && event.target !== document.getElementById('custom-modal') && !force) return;
            document.getElementById('custom-modal').classList.remove('active');
        }

        // Инициализация при старте
        renderHeroesGrid();
        // Включаем вкладку героев по умолчанию
        selectTab('heroes');
        // Закрываем меню при клике вне него
        document.body.addEventListener('click', (e) => {
            if (isNavOpen && !e.target.closest('#nav-container') && !e.target.closest('.main-nav-btn')) toggleNav();
        });

    </script>
</body>
</html>
