<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Hub</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили адаптируются под темную/светлую тему самого Telegram пользователя */
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .hidden { display: none !important; }
        .header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            font-weight: bold;
        }
        button.small {
            width: auto;
            font-size: 14px;
            padding: 6px 12px;
            background-color: var(--tg-theme-secondary-bg-color, #444);
            color: var(--tg-theme-text-color, #fff);
        }
        input {
            width: calc(100% - 20px);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color, #555);
            background: var(--tg-theme-bg-color, #222);
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px;
        }
        .profile-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .profile-list li {
            background: var(--tg-theme-secondary-bg-color, #333);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s opacity;
        }
        .profile-list li:active {
            opacity: 0.7;
        }
        .profile-id {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #aaa);
        }
    </style>
</head>
<body>

<!-- Кнопка смены профиля сверху -->
<div class="header hidden" id="header">
    <button class="small" onclick="resetProfile()">🔄 Сменить профиль</button>
</div>

<!-- Экран 1: Ввод ника -->
<div class="container" id="step-login">
    <h2>Deadlock Hub</h2>
    <p>Введи свой никнейм в Steam</p>
    <input type="text" id="steam-nick" placeholder="Например: gabe_newell">
    <button onclick="searchProfiles()">Найти профиль</button>
</div>

<!-- Экран 2: Выбор профиля -->
<div class="container hidden" id="step-select">
    <h2>Выбери свой профиль</h2>
    <p>Найдено несколько совпадений:</p>
    <ul class="profile-list" id="profiles-container">
        <!-- Сюда динамически вставятся результаты -->
    </ul>
    <button class="small" onclick="showStep('login')">⬅ Назад</button>
</div>

<!-- Экран 3: Хаб -->
<div class="container hidden" id="step-hub">
    <h2 id="hub-title">Привет!</h2>
    <p>Где посмотрим статистику?</p>
    <button onclick="openSite('https://statlocker.gg')">📊 Statlocker</button>
    <button onclick="openSite('https://buildlocker.gg')">🛠 Buildlocker</button>
</div>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Открываем приложение на всю высоту

    // Функция поиска профилей
    async function searchProfiles() {
        const nick = document.getElementById('steam-nick').value.trim();
        if (!nick) {
            tg.showAlert("Пожалуйста, введи никнейм!");
            return;
        }

        // ВАЖНО: Здесь в реальности должен быть запрос к твоему серверу,
        // который будет парсить statlocker и возвращать Steam ID.
        // Пока здесь стоит мок-дата (заглушка) для демонстрации логики.
        
        /* Пример реального запроса:
           const response = await fetch(`https://твой-бэкенд.com/api/search?q=${nick}`);
           const results = await response.json(); 
        */

        const mockResults = [
            { id: '12345678', name: nick, avatar: '🎮' },
            { id: '87654321', name: nick + '_smurf', avatar: '🎮' }
        ];

        // Если найден только 1 профиль, можно сразу сохранять:
        if (mockResults.length === 1) {
            saveProfile(mockResults[0]);
        } else {
            renderProfiles(mockResults);
            showStep('select');
        }
    }

    // Отрисовка списка профилей
    function renderProfiles(profiles) {
        const container = document.getElementById('profiles-container');
        container.innerHTML = '';
        
        profiles.forEach(p => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${p.avatar} <b>${p.name}</b></span> <span class="profile-id">ID: ${p.id}</span>`;
            li.onclick = () => saveProfile(p);
            container.appendChild(li);
        });
    }

    // Сохранение выбранного профиля в память телефона
    function saveProfile(profile) {
        localStorage.setItem('dl_profile', JSON.stringify(profile));
        showHub(profile);
    }

    // Сброс профиля (кнопка сверху)
    function resetProfile() {
        localStorage.removeItem('dl_profile');
        document.getElementById('steam-nick').value = '';
        showStep('login');
    }

    // Показ главного хаба
    function showHub(profile) {
        document.getElementById('hub-title').innerText = `Профиль: ${profile.name}`;
        showStep('hub');
    }

    // Переход на выбранный сайт
    function openSite(baseUrl) {
        const profile = JSON.parse(localStorage.getItem('dl_profile'));
        if (!profile) return resetProfile();

        // Формируем ссылку. Точный путь зависит от структуры сайтов.
        // Обычно это что-то вроде statlocker.gg/profile/12345678
        const url = `${baseUrl}/profile/${profile.id}`; 
        
        // Открываем ссылку внутри встроенного браузера Telegram
        tg.openLink(url);
    }

    // Управление экранами
    function showStep(step) {
        document.getElementById('step-login').classList.add('hidden');
        document.getElementById('step-select').classList.add('hidden');
        document.getElementById('step-hub').classList.add('hidden');
        
        if (step === 'login') {
            document.getElementById('header').classList.add('hidden');
            document.getElementById('step-login').classList.remove('hidden');
        } else if (step === 'select') {
            document.getElementById('header').classList.add('hidden');
            document.getElementById('step-select').classList.remove('hidden');
        } else if (step === 'hub') {
            document.getElementById('header').classList.remove('hidden');
            document.getElementById('step-hub').classList.remove('hidden');
        }
    }

    // При старте приложения проверяем, был ли профиль сохранен ранее
    window.onload = () => {
        const saved = localStorage.getItem('dl_profile');
        if (saved) {
            showHub(JSON.parse(saved));
        } else {
            showStep('login');
        }
    };
</script>

</body>
</html>
