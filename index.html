<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deadlock Library</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Rajdhani (киберспорт/техно) и Inter (для текста) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0d0d0d',       // Глубокий черный фон
                        surface: '#151515',    // Темно-серые карточки
                        surfaceLight: '#1f1f1f',
                        gold: '#d4af37',       // Классическое золото
                        goldGlow: '#ffdf73',   // Яркое золото для свечения
                        textMain: '#e5e5e5',
                        textMuted: '#808080'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        esports: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden; /* Блокируем скролл самого body, скроллится только main */
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 2px; }

        /* Киберспортивные стили */
        .esports-title {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }
        
        .gold-border:hover {
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Анимация вкладок */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           АНИМАЦИЯ НАВИГАЦИИ (ВЫЕЗЖАЮЩИЕ КНОПКИ)
           ========================================= */
        .nav-menu-container {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: none; /* Пропускаем клики сквозь контейнер */
        }

        /* Центральная кнопка D */
        .center-btn {
            position: relative;
            z-index: 60;
            width: 64px;
            height: 64px;
            background: #0d0d0d;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(212, 175, 55, 0.2);
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), box-shadow 0.3s ease;
            pointer-events: auto; /* Возвращаем кликабельность */
            outline: none;
        }
        
        .center-btn.active {
            transform: rotate(360deg);
            box-shadow: 0 0 25px rgba(255, 223, 115, 0.6), inset 0 0 15px rgba(212, 175, 55, 0.5);
            border-color: #ffdf73;
        }

        .center-btn span {
            font-family: 'Rajdhani', sans-serif;
            color: #d4af37;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
            margin-top: 2px; /* Легкая центровка шрифта */
        }

        /* Выезжающие кнопки меню */
        .nav-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 46px;
            height: 46px;
            background: #151515;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            color: #808080;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            /* Прячем их за центральной кнопкой по умолчанию */
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
            z-index: 55;
        }

        .nav-item.selected {
            color: #d4af37;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Состояния выезда (рассчитано от центра экрана влево и вправо) */
        .nav-expanded .nav-item[data-target="meta"] {
            transform: translate(calc(-50% - 120px), -50%) scale(1);
            opacity: 1;
        }
        .nav-expanded .nav-item[data-target="heroes"] {
            transform: translate(calc(-50% - 65px), -50%) scale(1);
            opacity: 1;
        }
        .nav-expanded .nav-item[data-target="items"] {
            transform: translate(calc(-50% + 65px), -50%) scale(1);
            opacity: 1;
        }
        .nav-expanded .nav-item[data-target="patches"] {
            transform: translate(calc(-50% + 120px), -50%) scale(1);
            opacity: 1;
        }

        /* Метки над кнопками при открытом меню */
        .nav-label {
            position: absolute;
            top: -20px;
            font-size: 10px;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .nav-expanded .nav-item .nav-label {
            opacity: 1;
            transition-delay: 0.2s;
        }
        .nav-item.selected .nav-label {
            color: #d4af37;
            text-shadow: 0 0 5px rgba(212,175,55,0.5);
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Верхний бар -->
    <header class="bg-base border-b border-gold/30 p-4 flex justify-between items-center z-10 shrink-0 relative">
        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-gold to-transparent opacity-50"></div>
        <div class="flex items-center gap-3">
            <span class="text-gold text-2xl"><i class="fa-solid fa-chart-simple"></i></span>
            <div>
                <h1 class="text-textMain esports-title font-bold text-xl leading-none">Deadlock<span class="text-gold glow-text">ONE</span></h1>
                <p class="text-[10px] text-textMuted uppercase tracking-widest mt-1">Esports Tracker</p>
            </div>
        </div>
        <div id="user-info" class="text-xs text-gold/80 esports-title font-bold tracking-wider"></div>
    </header>

    <!-- Основной контент -->
    <!-- pb-28 чтобы контент не перекрывался выезжающим меню -->
    <main class="flex-1 overflow-y-auto pb-28 px-4 pt-4 relative bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]" id="main-content">
        
        <!-- Вкладка: META -->
        <section id="tab-meta" class="tab-content active space-y-6">
            <!-- Заполняется JS -->
        </section>

        <!-- Вкладка: HEROES -->
        <section id="tab-heroes" class="tab-content space-y-4">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gold/50"></i>
                <input type="text" id="hero-search" placeholder="CALLSIGN / HERO..." class="w-full bg-surface border border-gold/30 rounded pl-10 pr-4 py-3 text-textMain placeholder-textMuted focus:outline-none focus:border-gold esports-title text-sm transition-colors">
            </div>
            <div id="heroes-grid" class="grid grid-cols-2 gap-3">
                <!-- Заполняется JS -->
            </div>
        </section>

        <!-- Вкладка: ITEMS -->
        <section id="tab-items" class="tab-content space-y-6">
            <!-- Заполняется JS -->
        </section>

        <!-- Вкладка: PATCHES -->
        <section id="tab-patches" class="tab-content space-y-4">
            <h2 class="text-2xl esports-title text-textMain flex items-center gap-2 mb-4">
                <i class="fa-solid fa-code-branch text-gold"></i> Patch Intel
            </h2>
            <div id="patches-list" class="space-y-4 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-gold/30 before:to-transparent">
                <!-- Заполняется JS -->
            </div>
        </section>

    </main>

    <!-- Выезжающее навигационное меню -->
    <div class="nav-menu-container" id="nav-container">
        
        <!-- Кнопки разделов (спрятаны) -->
        <button class="nav-item selected" data-target="meta" onclick="selectTab('meta')">
            <span class="nav-label">Meta</span>
            <i class="fa-solid fa-fire"></i>
        </button>
        
        <button class="nav-item" data-target="heroes" onclick="selectTab('heroes')">
            <span class="nav-label">Heroes</span>
            <i class="fa-solid fa-users"></i>
        </button>
        
        <button class="nav-item" data-target="items" onclick="selectTab('items')">
            <span class="nav-label">Items</span>
            <i class="fa-solid fa-cube"></i>
        </button>
        
        <button class="nav-item" data-target="patches" onclick="selectTab('patches')">
            <span class="nav-label">Intel</span>
            <i class="fa-solid fa-terminal"></i>
        </button>

        <!-- Центральная кнопка D (Логотип) -->
        <button class="center-btn" id="center-logo" onclick="toggleNav()">
            <span>D</span>
        </button>
    </div>

    <!-- Скрипты -->
    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#0d0d0d');
        tg.setBackgroundColor('#0d0d0d');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-info').innerText = `[ ${tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name} ]`;
        } else {
            document.getElementById('user-info').innerText = `[ GUEST ]`;
        }

        // ==========================================
        // ЛОГИКА АНИМАЦИИ МЕНЮ
        // ==========================================
        let isNavOpen = false;
        const navContainer = document.getElementById('nav-container');
        const centerLogo = document.getElementById('center-logo');

        function toggleNav() {
            isNavOpen = !isNavOpen;
            if (isNavOpen) {
                navContainer.classList.add('nav-expanded');
                centerLogo.classList.add('active');
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } else {
                navContainer.classList.remove('nav-expanded');
                centerLogo.classList.remove('active');
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        }

        function selectTab(tabId) {
            // Закрываем все вкладки
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Открываем нужную
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            // Обновляем визуальный статус кнопок навигации
            document.querySelectorAll('.nav-item').forEach(btn => {
                if(btn.dataset.target === tabId) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Скролл вверх
            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });

            // Закрываем меню после выбора
            toggleNav();
        }

        // Закрытие меню при клике в пустое место
        document.getElementById('main-content').addEventListener('click', () => {
            if (isNavOpen) toggleNav();
        });


        // ==========================================
        // ДАННЫЕ И РЕНДЕРИНГ (MOCK DATA)
        // ==========================================

        const heroesData = [
            { id: 'seven', name: 'Seven', role: 'Carry', winrate: '54.2%', pickrate: '18.5%', kda: '3.2', img: 'https://placehold.co/200x200/151515/d4af37?text=Svn' },
            { id: 'vindicta', name: 'Vindicta', role: 'Sniper', winrate: '51.8%', pickrate: '15.2%', kda: '3.8', img: 'https://placehold.co/200x200/151515/d4af37?text=Vnd' },
            { id: 'abrams', name: 'Abrams', role: 'Bruiser', winrate: '53.1%', pickrate: '14.8%', kda: '2.5', img: 'https://placehold.co/200x200/151515/d4af37?text=Abr' },
            { id: 'dynamo', name: 'Dynamo', role: 'Support', winrate: '49.5%', pickrate: '8.4%', kda: '1.9', img: 'https://placehold.co/200x200/151515/d4af37?text=Dyn' },
            { id: 'haze', name: 'Haze', role: 'Assassin', winrate: '48.9%', pickrate: '21.0%', kda: '2.8', img: 'https://placehold.co/200x200/151515/d4af37?text=Hz' },
            { id: 'kelvin', name: 'Kelvin', role: 'Control', winrate: '52.4%', pickrate: '9.1%', kda: '2.9', img: 'https://placehold.co/200x200/151515/d4af37?text=Klv' }
        ];

        const itemsData = [
            { cat: 'Weapon', color: 'text-orange-500', name: 'High-Velocity Mag', cost: 1250, desc: '+ Bullet Velocity & Damage.' },
            { cat: 'Weapon', color: 'text-orange-500', name: 'Silencer', cost: 3000, desc: 'Active: Silences target on hit.' },
            { cat: 'Vitality', color: 'text-green-500', name: 'Bullet Armor', cost: 1250, desc: '+20% Bullet Resist.' },
            { cat: 'Vitality', color: 'text-green-500', name: 'Colossus', cost: 6200, desc: 'Massive HP & Model size increase.' },
            { cat: 'Spirit', color: 'text-purple-500', name: 'Improved Cooldown', cost: 3000, desc: 'Reduces abilities cooldown.' },
            { cat: 'Spirit', color: 'text-purple-500', name: 'Diviner\'s Kevlar', cost: 6200, desc: 'Spirit Shield & Lifesteal.' }
        ];

        const patchesData = [
            { version: 'v0.4.5', date: 'OCT 20, 2026', type: 'balance', desc: 'Vindicta early game damage scaling reduced by 12%. Colossus cost increased to 6200 souls. Seven Ultimate bug fixed.' },
            { version: 'v0.4.4', date: 'OCT 12, 2026', type: 'map', desc: 'Mid lane geometry updated. Added new cover spots near the transit lines. Abrams base health +50.' },
            { version: 'v0.4.3', date: 'OCT 01, 2026', type: 'system', desc: 'Global economy overhaul. Jungle creeps now yield 10% fewer souls in the first 10 minutes.' }
        ];

        function renderMeta() {
            const container = document.getElementById('tab-meta');
            const topHeroes = [...heroesData].sort((a, b) => parseFloat(b.winrate) - parseFloat(a.winrate)).slice(0, 3);
            
            container.innerHTML = `
                <div>
                    <h2 class="text-xl esports-title text-textMain flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-trophy text-gold"></i> Top Tier Agents
                    </h2>
                    <div class="space-y-3">
                        ${topHeroes.map((h, i) => `
                            <div class="bg-surface border-l-4 border-gold rounded p-3 flex items-center gap-4 relative overflow-hidden">
                                <!-- Фоновое свечение -->
                                <div class="absolute right-0 top-0 w-32 h-full bg-gradient-to-l from-gold/10 to-transparent"></div>
                                
                                <div class="text-2xl font-bold text-gold/30 esports-title w-6 text-center">0${i + 1}</div>
                                <img src="${h.img}" alt="${h.name}" class="w-12 h-12 rounded bg-base border border-gold/20">
                                <div class="flex-1 relative z-10">
                                    <div class="font-bold text-lg text-textMain esports-title tracking-wide">${h.name}</div>
                                    <div class="text-[10px] text-textMuted uppercase tracking-widest">${h.role}</div>
                                </div>
                                <div class="text-right relative z-10">
                                    <div class="text-gold glow-text font-bold text-lg">${h.winrate}</div>
                                    <div class="text-[10px] text-textMuted uppercase">Win Rate</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="mt-8">
                    <h2 class="text-xl esports-title text-textMain flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-fire-flame-curved text-gold"></i> Meta Items
                    </h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-surface gold-border rounded p-3 text-center">
                            <i class="fa-solid fa-crosshairs text-orange-500 mb-2 text-xl drop-shadow-[0_0_5px_rgba(249,115,22,0.8)]"></i>
                            <div class="text-sm font-bold text-textMain esports-title">High-Velocity Mag</div>
                            <div class="text-gold text-xs mt-1 font-bold"><i class="fa-solid fa-coins text-[10px]"></i> 1250</div>
                        </div>
                        <div class="bg-surface gold-border rounded p-3 text-center">
                            <i class="fa-solid fa-heart-pulse text-green-500 mb-2 text-xl drop-shadow-[0_0_5px_rgba(34,197,94,0.8)]"></i>
                            <div class="text-sm font-bold text-textMain esports-title">Colossus</div>
                            <div class="text-gold text-xs mt-1 font-bold"><i class="fa-solid fa-coins text-[10px]"></i> 6200</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHeroes(filter = '') {
            const container = document.getElementById('heroes-grid');
            const filtered = heroesData.filter(h => h.name.toLowerCase().includes(filter.toLowerCase()));
            
            if (!filtered.length) {
                container.innerHTML = `<div class="col-span-2 text-center text-textMuted py-10 esports-title">AGENT NOT FOUND</div>`;
                return;
            }

            container.innerHTML = filtered.map(h => `
                <div class="bg-surface gold-border rounded overflow-hidden flex flex-col relative group">
                    <!-- Техно-декор уголок -->
                    <div class="absolute top-0 right-0 w-4 h-4 border-t border-r border-gold/50 m-1"></div>
                    
                    <img src="${h.img}" alt="${h.name}" class="w-full h-24 object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-gold glow-text esports-title text-lg uppercase leading-none">${h.name}</h3>
                        <p class="text-[10px] text-textMuted uppercase tracking-widest mb-2 mt-1">${h.role}</p>
                        
                        <div class="mt-auto grid grid-cols-2 gap-1 border-t border-gold/20 pt-2">
                            <div>
                                <span class="text-textMuted block text-[8px] uppercase">WR</span>
                                <span class="text-textMain text-sm font-bold">${h.winrate}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-textMuted block text-[8px] uppercase">KDA</span>
                                <span class="text-textMain text-sm font-bold">${h.kda}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderItems() {
            const container = document.getElementById('tab-items');
            container.innerHTML = `
                <h2 class="text-xl esports-title text-textMain flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-cubes text-gold"></i> Armory
                </h2>
                <div class="space-y-3">
                    ${itemsData.map(item => `
                        <div class="bg-surface gold-border rounded p-3 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded bg-base border border-gold/20 flex items-center justify-center ${item.color}">
                                    <i class="fa-solid ${item.cat === 'Weapon' ? 'fa-crosshairs' : item.cat === 'Vitality' ? 'fa-heart' : 'fa-fire-flame-curved'}"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-textMain esports-title text-base tracking-wide">${item.name}</div>
                                    <div class="text-[10px] text-textMuted line-clamp-1">${item.desc}</div>
                                </div>
                            </div>
                            <div class="text-gold font-bold flex items-center gap-1 shrink-0">
                                <i class="fa-solid fa-coins text-[10px]"></i> ${item.cost}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderPatches() {
            const container = document.getElementById('patches-list');
            container.innerHTML = patchesData.map((patch, i) => `
                <div class="relative flex items-start group">
                    <!-- Узел таймлайна -->
                    <div class="absolute left-0 md:left-1/2 flex items-center justify-center w-10 h-10 -ml-5 md:-ml-5 bg-base border-2 border-gold rounded-full z-10 shadow-[0_0_10px_rgba(212,175,55,0.5)]">
                        <i class="fa-solid ${patch.type === 'balance' ? 'fa-scale-balanced' : patch.type === 'map' ? 'fa-map' : 'fa-gear'} text-gold text-sm"></i>
                    </div>
                    
                    <!-- Карточка -->
                    <div class="ml-8 md:ml-0 md:w-1/2 ${i % 2 === 0 ? 'md:pr-10' : 'md:pl-10 md:ml-auto'} pb-6">
                        <div class="bg-surface gold-border p-4 rounded relative">
                            <!-- Декоративная линия коннектора для десктопа (в ТГ не особо видно, но структура правильная) -->
                            <div class="flex justify-between items-end mb-2 border-b border-gold/20 pb-2">
                                <h3 class="font-bold text-gold glow-text esports-title text-lg">${patch.version}</h3>
                                <span class="text-[10px] text-textMuted font-mono tracking-widest">${patch.date}</span>
                            </div>
                            <p class="text-xs text-textMain leading-relaxed">${patch.desc}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Слушатель поиска
        document.getElementById('hero-search').addEventListener('input', (e) => renderHeroes(e.target.value));

        // Инициализация
        renderMeta();
        renderHeroes();
        renderItems();
        renderPatches();

    </script>
</body>
</html>
```
