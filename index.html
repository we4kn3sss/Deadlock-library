<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deadlock Library</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cormorant Garamond (винтажные заголовки) и Inter (читаемый текст) -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        noirBg: '#0a0a09',       // Глубокий темный фон
                        noirCard: '#161513',     // Темно-серо-коричневый для карточек
                        parchment: '#e6dcc6',    // Бледный пергамент для текста и акцентов
                        parchmentMuted: '#8c8577',// Приглушенный пергамент
                        accentDark: '#2a2825'    // Темный акцент для бордеров
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0a09;
            color: #e6dcc6;
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            /* Легкий паттерн шума/старой бумаги на фоне для атмосферы */
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.03"/%3E%3C/svg%3E');
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a09; }
        ::-webkit-scrollbar-thumb { background: #2a2825; border-radius: 0px; }

        /* Элегантные винтажные стили */
        .occult-title {
            font-family: '"Cormorant Garamond"', serif;
            letter-spacing: 0.05em;
        }

        .vintage-border {
            border: 1px solid rgba(230, 220, 198, 0.15);
            transition: border-color 0.3s ease;
        }
        
        .vintage-border:hover {
            border-color: rgba(230, 220, 198, 0.4);
        }

        /* Декоративная линия */
        .vintage-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(230, 220, 198, 0.3);
            margin: 1rem 0;
        }
        .vintage-divider::before, .vintage-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(230, 220, 198, 0.15);
        }
        .vintage-divider:not(:empty)::before { margin-right: .5em; }
        .vintage-divider:not(:empty)::after { margin-left: .5em; }

        /* Вкладки */
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Эффект старого фото для аватарок героев */
        .vintage-photo {
            filter: grayscale(60%) sepia(30%) contrast(110%);
            border-bottom: 1px solid rgba(230, 220, 198, 0.15);
        }

        /* =========================================
           НАВИГАЦИЯ (МЕХАНИКА ВЫЕЗДА)
           ========================================= */
        .nav-wrapper {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        /* Центральный логотип (Библиотека) */
        .main-nav-btn {
            position: relative;
            z-index: 60;
            width: 64px;
            height: 64px;
            background-color: #161513;
            background-image: url('./58401.jpg');
            background-size: cover;
            background-position: center;
            border: 1px solid #e6dcc6;
            border-radius: 50%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            outline: none;
            cursor: pointer;
        }
        
        .main-nav-btn.active {
            transform: rotate(360deg);
        }

        /* Выезжающие кнопки меню */
        .nav-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            background: #161513;
            border: 1px solid rgba(230, 220, 198, 0.3);
            border-radius: 50%;
            color: #8c8577;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            z-index: 55;
            cursor: pointer;
        }

        .nav-item.selected {
            color: #e6dcc6;
            border-color: #e6dcc6;
            background: #2a2825;
        }

        /* Позиции при выезде */
        .nav-expanded .nav-item[data-target="meta"] {
            transform: translate(calc(-50% - 130px), -50%) scale(1);
            opacity: 1;
        }
        .nav-expanded .nav-item[data-target="heroes"] {
            transform: translate(calc(-50% - 70px), -50%) scale(1);
            opacity: 1;
        }
        .nav-expanded .nav-item[data-target="items"] {
            transform: translate(calc(-50% + 70px), -50%) scale(1);
            opacity: 1;
        }
        .nav-expanded .nav-item[data-target="patches"] {
            transform: translate(calc(-50% + 130px), -50%) scale(1);
            opacity: 1;
        }

        /* Метки над кнопками */
        .nav-label {
            position: absolute;
            top: -24px;
            font-size: 11px;
            font-family: '"Cormorant Garamond"', serif;
            letter-spacing: 0.05em;
            color: #e6dcc6;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .nav-expanded .nav-item .nav-label {
            opacity: 1;
            transition-delay: 0.1s;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Заголовок -->
    <header class="bg-noirBg pt-6 pb-4 px-4 flex flex-col items-center justify-center z-10 shrink-0 border-b border-white/5 relative">
        <h1 class="text-parchment occult-title text-3xl font-semibold">Deadlock Library</h1>
        <div class="vintage-divider w-32 mt-2 mb-0"><i class="fa-solid fa-diamond text-[6px]"></i></div>
        <div id="user-info" class="absolute top-4 right-4 text-[10px] text-parchmentMuted uppercase tracking-widest font-sans"></div>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto pb-32 px-4 pt-6" id="main-content">
        
        <!-- Вкладка: META -->
        <section id="tab-meta" class="tab-content active space-y-8">
            <!-- Заполняется JS -->
        </section>

        <!-- Вкладка: HEROES -->
        <section id="tab-heroes" class="tab-content space-y-5">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-parchmentMuted text-sm"></i>
                <input type="text" id="hero-search" placeholder="Search the archives..." class="w-full bg-noirCard vintage-border rounded-none pl-9 pr-4 py-2.5 text-parchment placeholder-parchmentMuted focus:outline-none focus:border-parchment font-serif text-lg transition-colors">
            </div>
            <div id="heroes-grid" class="grid grid-cols-2 gap-4">
                <!-- Заполняется JS -->
            </div>
        </section>

        <!-- Вкладка: ITEMS -->
        <section id="tab-items" class="tab-content space-y-6">
            <!-- Заполняется JS -->
        </section>

        <!-- Вкладка: PATCHES -->
        <section id="tab-patches" class="tab-content space-y-6">
            <div class="text-center mb-6">
                <h2 class="text-2xl occult-title text-parchment">Archive Records</h2>
                <p class="text-xs text-parchmentMuted mt-1">Recent adjustments and findings</p>
            </div>
            <div id="patches-list" class="space-y-6 relative before:absolute before:inset-0 before:ml-[11px] before:-translate-x-px before:h-full before:w-[1px] before:bg-accentDark">
                <!-- Заполняется JS -->
            </div>
        </section>

    </main>

    <!-- Выезжающее меню -->
    <div class="nav-wrapper" id="nav-container">
        
        <button class="nav-item selected" data-target="meta" onclick="selectTab('meta')">
            <span class="nav-label">Meta</span>
            <i class="fa-solid fa-chart-line"></i>
        </button>
        
        <button class="nav-item" data-target="heroes" onclick="selectTab('heroes')">
            <span class="nav-label">Roster</span>
            <i class="fa-solid fa-users-viewfinder"></i>
        </button>
        
        <button class="nav-item" data-target="items" onclick="selectTab('items')">
            <span class="nav-label">Armory</span>
            <i class="fa-solid fa-box-open"></i>
        </button>
        
        <button class="nav-item" data-target="patches" onclick="selectTab('patches')">
            <span class="nav-label">Records</span>
            <i class="fa-solid fa-scroll"></i>
        </button>

        <!-- Центральная кнопка с логотипом -->
        <button class="main-nav-btn" id="center-logo" onclick="toggleNav()"></button>
    </div>

    <!-- Скрипты -->
    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#0a0a09');
        tg.setBackgroundColor('#0a0a09');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-info').innerText = `Investigator: ${tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name}`;
        }

        // ==========================================
        // НАВИГАЦИЯ
        // ==========================================
        let isNavOpen = false;
        const navContainer = document.getElementById('nav-container');
        const centerLogo = document.getElementById('center-logo');

        function toggleNav() {
            isNavOpen = !isNavOpen;
            if (isNavOpen) {
                navContainer.classList.add('nav-expanded');
                centerLogo.classList.add('active');
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            } else {
                navContainer.classList.remove('nav-expanded');
                centerLogo.classList.remove('active');
            }
        }

        function selectTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(btn => {
                if(btn.dataset.target === tabId) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });

            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
            toggleNav();
        }

        document.getElementById('main-content').addEventListener('click', () => {
            if (isNavOpen) toggleNav();
        });


        // ==========================================
        // ДАННЫЕ (MOCK DATA)
        // ==========================================

        const heroesData = [
            { id: 'seven', name: 'Seven', role: 'Carry', winrate: '54.2%', pickrate: '18.5%', img: 'https://placehold.co/300x250/161513/e6dcc6?text=Seven' },
            { id: 'vindicta', name: 'Vindicta', role: 'Sniper', winrate: '51.8%', pickrate: '15.2%', img: 'https://placehold.co/300x250/161513/e6dcc6?text=Vindicta' },
            { id: 'abrams', name: 'Abrams', role: 'Bruiser', winrate: '53.1%', pickrate: '14.8%', img: 'https://placehold.co/300x250/161513/e6dcc6?text=Abrams' },
            { id: 'dynamo', name: 'Dynamo', role: 'Support', winrate: '49.5%', pickrate: '8.4%', img: 'https://placehold.co/300x250/161513/e6dcc6?text=Dynamo' },
            { id: 'haze', name: 'Haze', role: 'Assassin', winrate: '48.9%', pickrate: '21.0%', img: 'https://placehold.co/300x250/161513/e6dcc6?text=Haze' },
            { id: 'kelvin', name: 'Kelvin', role: 'Control', winrate: '52.4%', pickrate: '9.1%', img: 'https://placehold.co/300x250/161513/e6dcc6?text=Kelvin' }
        ];

        const itemsData = [
            { cat: 'Weapon', type: 'weapon', name: 'High-Velocity Mag', cost: 1250, desc: 'Increases bullet velocity and overall weapon damage output.' },
            { cat: 'Vitality', type: 'vitality', name: 'Colossus', cost: 6200, desc: 'Grants massive health reserves and increases physical model size.' },
            { cat: 'Spirit', type: 'spirit', name: 'Improved Cooldown', cost: 3000, desc: 'Reduces the recovery time required between occult abilities.' },
            { cat: 'Weapon', type: 'weapon', name: 'Silencer', cost: 3000, desc: 'Active: Temporarily seals the target\'s ability to use skills.' }
        ];

        const patchesData = [
            { version: 'v0.4.5', date: 'October 20, 193X', desc: 'Vindicta early game damage scaling reduced. Colossus soul cost increased. Resolved anomalies regarding Seven\'s ultimate state.' },
            { version: 'v0.4.4', date: 'October 12, 193X', desc: 'Mid lane geometry updated to provide more cover near the transit lines. Abrams base vitality slightly increased.' }
        ];

        // ==========================================
        // РЕНДЕРИНГ
        // ==========================================

        function renderMeta() {
            const container = document.getElementById('tab-meta');
            const topHeroes = [...heroesData].sort((a, b) => parseFloat(b.winrate) - parseFloat(a.winrate)).slice(0, 3);
            
            container.innerHTML = `
                <div>
                    <h2 class="text-xl occult-title text-parchment mb-4">Highest Success Rate</h2>
                    <div class="space-y-3">
                        ${topHeroes.map((h, i) => `
                            <div class="bg-noirCard vintage-border p-3 flex items-center gap-4">
                                <div class="font-serif text-xl text-parchmentMuted w-4 text-center">${i + 1}.</div>
                                <div class="flex-1">
                                    <div class="font-serif text-lg text-parchment">${h.name}</div>
                                    <div class="text-[10px] text-parchmentMuted uppercase tracking-widest">${h.role}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-parchment font-serif text-lg">${h.winrate}</div>
                                    <div class="text-[10px] text-parchmentMuted uppercase tracking-wider">Win Rate</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div>
                    <h2 class="text-xl occult-title text-parchment mb-4">Frequently Requisitioned</h2>
                    <div class="grid grid-cols-2 gap-3">
                        ${itemsData.slice(0,2).map(item => `
                            <div class="bg-noirCard vintage-border p-4 text-center flex flex-col items-center">
                                <div class="w-8 h-8 rounded-full border border-parchment/20 flex items-center justify-center mb-2">
                                   <i class="fa-solid ${item.type === 'weapon' ? 'fa-crosshairs' : 'fa-heart'} text-parchmentMuted text-sm"></i>
                                </div>
                                <div class="text-sm font-serif text-parchment mb-1">${item.name}</div>
                                <div class="text-parchmentMuted text-xs flex items-center gap-1 font-serif">
                                    <i class="fa-solid fa-ghost text-[10px]"></i> ${item.cost}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderHeroes(filter = '') {
            const container = document.getElementById('heroes-grid');
            const filtered = heroesData.filter(h => h.name.toLowerCase().includes(filter.toLowerCase()));
            
            if (!filtered.length) {
                container.innerHTML = `<div class="col-span-2 text-center text-parchmentMuted py-10 font-serif italic">No records found...</div>`;
                return;
            }

            container.innerHTML = filtered.map(h => `
                <div class="bg-noirCard vintage-border flex flex-col group cursor-pointer hover:bg-accentDark transition-colors">
                    <div class="p-1 border-b border-parchment/10">
                        <img src="${h.img}" alt="${h.name}" class="w-full h-28 object-cover vintage-photo">
                    </div>
                    <div class="p-3">
                        <h3 class="font-serif text-lg text-parchment leading-none mb-1">${h.name}</h3>
                        <p class="text-[9px] text-parchmentMuted uppercase tracking-widest">${h.role}</p>
                        
                        <div class="mt-3 flex justify-between items-end border-t border-parchment/10 pt-2">
                            <span class="text-parchmentMuted text-[10px] uppercase">Win</span>
                            <span class="text-parchment font-serif text-sm">${h.winrate}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderItems() {
            const container = document.getElementById('tab-items');
            container.innerHTML = `
                <div class="space-y-3">
                    ${itemsData.map(item => `
                        <div class="bg-noirCard vintage-border p-4 flex gap-4">
                            <div class="mt-1">
                                <div class="w-10 h-10 border border-parchment/20 flex items-center justify-center bg-noirBg">
                                    <i class="fa-solid ${item.type === 'weapon' ? 'fa-crosshairs' : item.type === 'vitality' ? 'fa-heart' : 'fa-eye'} text-parchment text-sm"></i>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-1">
                                    <div class="font-serif text-lg text-parchment leading-tight">${item.name}</div>
                                    <div class="text-parchmentMuted text-xs flex items-center gap-1 font-serif shrink-0">
                                        <i class="fa-solid fa-ghost text-[10px]"></i> ${item.cost}
                                    </div>
                                </div>
                                <div class="text-xs text-parchmentMuted leading-relaxed">${item.desc}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderPatches() {
            const container = document.getElementById('patches-list');
            container.innerHTML = patchesData.map((patch, i) => `
                <div class="relative pl-8">
                    <!-- Узел таймлайна (точка) -->
                    <div class="absolute left-[8px] top-1.5 w-1.5 h-1.5 bg-parchment rounded-full outline outline-4 outline-noirBg"></div>
                    
                    <div class="bg-noirCard vintage-border p-4">
                        <div class="flex justify-between items-center mb-2 border-b border-parchment/10 pb-2">
                            <h3 class="font-serif text-lg text-parchment">${patch.version}</h3>
                            <span class="text-[10px] text-parchmentMuted tracking-wider uppercase">${patch.date}</span>
                        </div>
                        <p class="text-xs text-parchmentMuted leading-relaxed">${patch.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('hero-search').addEventListener('input', (e) => renderHeroes(e.target.value));

        // Инициализация
        renderMeta();
        renderHeroes();
        renderItems();
        renderPatches();

    </script>
</body>
</html>
